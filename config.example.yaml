# Copy to config.yaml and fill in `home`. The API key is NOT stored here -
# export IMMICH_API_KEY in the environment (see the launchd plist).
#
#   cp config.example.yaml config.yaml

# Photos within `home_radius_km` of a home are "not a trip".
# Use tools/find_home.py to derive these from your own library — it ranks
# candidates by distinct days and breaks them down by year, which is how you
# spot a house move (one row goes quiet as another lights up) or a second home
# (two rows busy across the same years).
home:
  lat: 0.0
  lon: 0.0

# If you have more than one home, or moved house, use `homes:` instead of
# `home:` — a single fixed point makes ordinary life at the other address
# cluster and get named as a trip. A photo counts as away only when it is far
# from *every* home in effect on the day it was taken.
#
# `from` is inclusive, `until` is exclusive, both YYYY-MM-DD; omit either side
# for unbounded. A home with neither is always in effect.
#
# homes:
#   - lat: 33.7879
#     lon: -117.8531
#     label: Orange
#     until: 2024-06-01
#   - lat: 34.0522
#     lon: -118.2437
#     label: Los Angeles
#     from: 2024-06-01
#   - lat: 38.9140          # second home, concurrent with the above
#     lon: 121.6147
#     label: Dalian

state_db: trips.db

# "offline" uses the reverse_geocoder package (no network, no rate limits).
# "none" names stops by coordinates.
geocoder: offline

# Optional prefix on generated album names, e.g. "Trip: ".
album_prefix: ""

api:
  base_url: http://localhost:2283
  timeout_seconds: 60
  page_size: 1000

  # VERIFY THESE against your running instance before the first --apply:
  #   ./cluster_trips.py --check-api
  # Immich moves endpoints between releases. Pin the Immich version in
  # docker-compose.yml so an auto-update can't break this silently.
  search_assets: /api/search/metadata
  create_album: /api/albums
  update_album: /api/albums/{id}
  add_album_assets: /api/albums/{id}/assets
  openapi_spec: /api/specs-json

# Starting points, not answers. Expect two or three rounds of dry-run tuning.
# max_gap_hours and home_radius_km move the results the most.
thresholds:
  # Trip segmentation
  home_radius_km: 40.0        # further than this from home = "away"
  max_gap_hours: 36.0         # a longer gap splits one trip into two
  min_duration_days: 2.0      # shorter runs are discarded...
  min_photos: 10              # ...as are sparser ones

  # Stop clustering: same stop if within this distance and time of the cluster
  stop_radius_km: 50.0
  # 30 rather than 12, so an overnight with no photos doesn't open a new stop
  # and split a multi-day stay in one city into one stop per day.
  stop_gap_hours: 30.0

  # Leg classification by implied speed between consecutive stops.
  # Implied speed always understates true travel speed, because the measurement
  # runs from one stop's last photo to the next stop's first photo and so
  # absorbs airport time. 150 is the practical floor: it equals
  # drive_max_speed_kmh, so anything faster than a car can sustain is a flight.
  # See the caveat in README.md for what this still misses.
  flight_min_speed_kmh: 150.0
  drive_min_speed_kmh: 40.0
  drive_max_speed_kmh: 150.0
  # Road-feasibility test, and the one that actually fires. Legs are measured
  # great-circle; roads run ~1.2-1.3x longer. If the road distance could not
  # have been covered in the elapsed time at a sustainable average, it was not
  # a car. 130/1.25 puts the effective great-circle cutoff at 104 km/h.
  # Raising circuity or lowering the ceiling starts calling hard drives
  # flights — 900 km in 9 h needs 125 km/h and is pinned in the tests.
  road_circuity_factor: 1.25
  max_sustained_road_kmh: 130.0
  long_haul_min_km: 100.0
  # Share of long-haul kilometres that must be covered on the ground for the
  # trip to count as a road trip. 1.0 = the strict "no flights" rule; lower to
  # ~0.5 to also catch fly-out-then-drive trips.
  road_trip_min_ground_fraction: 1.0

  # GPS backfill: don't interpolate across gaps longer than this
  max_interpolation_gap_hours: 6.0
